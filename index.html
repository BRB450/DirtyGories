<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dirtygories</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Dirtygories</h1>
  <p class="tagline">Scattegories, but filthy. 😈</p>

  <div class="controls">
    <label>Number of Categories:
      <input type="number" id="categoryCount" value="10" min="1" max="100">
    </label>
    <label>Time Limit (seconds):
      <input type="number" id="timeLimit" value="60" min="10" max="300">
    </label>
    <button id="newGame">Start Round</button>
    <button id="rerollLetter">Reroll Letter</button>
  </div>

  <div class="game">
    <h2>Letter: <span id="letter">?</span></h2>
    <h3>Time: <span id="timer">60</span> seconds</h3>
    <ul id="categoryList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
